services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/appareilsDB
      - PORT=3001
    depends_on:
      - mongo

  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mongodata: